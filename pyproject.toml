[project]
name = "banco-agil"
version = "0.1.0"
description = "Banco Ágil: multi-agent digital bank customer service built with LangGraph"
authors = [
    { name = "Eduardo Ramon Resser", email = "eduresser@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain-litellm>=0.11.2",
    "langfuse>=5.2.0",
    "langgraph>=1.2.22",
    "pydantic-settings>=2.16.3",
    "streamlit>=1.67.0",
    "tzdata>=2026.6",
]

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-tap>=3.6",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not llm and not live'"
markers = [
    "llm: scenarios that call the real chat and judge models; run with -m llm",
    "live: contract checks against the real exchange API; run with -m live",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN401"]
